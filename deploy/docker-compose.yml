# Compose de despliegue de la plataforma (apps/api + apps/web), compartido
# entre los proyectos `staging` y `production` en el mismo Lightsail de 32 GB
# (D-003, D-015). Sin secretos aquí: todo viene del .env del compose project
# (fuera del repo, en /opt/awkfactory/<entorno>/.env en el server).
#
# Uso en el server (nunca en local):
#   cd /opt/awkfactory/staging     # o /opt/awkfactory/production
#   docker compose --env-file .env -p awk-staging pull   # o awk-production
#   docker compose --env-file .env -p awk-staging up -d
#
# El Nginx nativo del host (no este compose) enruta:
#   https://<dominio>/api  -> 127.0.0.1:${API_PORT_HOST}  (contenedor api, NestJS en :3000)
#   https://<dominio>/     -> 127.0.0.1:${WEB_PORT_HOST}   (contenedor web, nginx:alpine estático)
#
# IMAGE_TAG por defecto "latest" (staging sigue main); producción se
# promueve fijando IMAGE_TAG=<sha> en su .env (re-tag = D-003 arquitectura).

services:
  api:
    image: ghcr.io/awakelab-dev/awkplatform-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      # Módulo moodle-insights (D-022): opcionales — sin ellas el módulo
      # muestra el replicado vacío y el sync devuelve 503, sin tumbar la API.
      MOODLE_URL: ${MOODLE_URL:-}
      MOODLE_TOKEN: ${MOODLE_TOKEN:-}
      # Timeout (ms) por llamada a Moodle WS, default 60000 en el código si se
      # omite. Subir en instancias grandes (validado 2026-07-13, ver STATUS.md).
      MOODLE_REQUEST_TIMEOUT_MS: ${MOODLE_REQUEST_TIMEOUT_MS:-}
      # Módulo orientador-ia (D-024/D-025): opcional — sin ANTHROPIC_API_KEY
      # el análisis de perfil devuelve 503, el resto del módulo funciona igual.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    ports:
      - '127.0.0.1:${API_PORT_HOST}:3000'
    healthcheck:
      # 127.0.0.1 explícito por la misma razón que el healthcheck de web
      # (ver comentario abajo): evita depender de cómo resuelva "localhost".
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/hello || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

  # Control plane de la Fábrica (apps/factory, D-030): HTTP de lectura,
  # decisión de gates, conector MCP y Authorization Server. Los runners del
  # Agent SDK NO corren aquí — por eso NO recibe ANTHROPIC_* ni monta el repo.
  # Desde D-047 lo que hace con un envío de Cowork es ENCOLARLO; quien ejecuta
  # es el servicio `factory-runner` de más abajo.
  # JWT_SECRET es el MISMO de la Plataforma: la Fábrica valida los tokens que
  # emite apps/api, no emite propios (D-030).
  factory:
    image: ghcr.io/awakelab-dev/awkplatform-factory:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      FACTORY_PORT: 3100
      FACTORY_DATABASE_URL: ${FACTORY_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      # Authorization Server propio del conector Cowork (docs/08, D-041).
      FACTORY_OAUTH_ISSUER: ${FACTORY_OAUTH_ISSUER}
      FACTORY_MCP_RESOURCE: ${FACTORY_MCP_RESOURCE}
      FACTORY_OAUTH_CLIENT_ID: ${FACTORY_OAUTH_CLIENT_ID}
      FACTORY_OAUTH_CLIENT_SECRET: ${FACTORY_OAUTH_CLIENT_SECRET}
      FACTORY_OAUTH_REDIRECT_URI: ${FACTORY_OAUTH_REDIRECT_URI}
      FACTORY_OAUTH_COOKIE_KEYS: ${FACTORY_OAUTH_COOKIE_KEYS}
      FACTORY_OAUTH_JWKS: ${FACTORY_OAUTH_JWKS}
      # Cliente público de prueba local (solo staging/dev; vacío en producción).
      FACTORY_OAUTH_DEV_REDIRECT: ${FACTORY_OAUTH_DEV_REDIRECT:-}
      FACTORY_OAUTH_DEV_CLIENT_ID: ${FACTORY_OAUTH_DEV_CLIENT_ID:-dev-local}
    ports:
      - '127.0.0.1:${FACTORY_PORT_HOST}:3100'
    healthcheck:
      # /factory-api/health es el único endpoint sin JWT (ver HealthController).
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3100/factory-api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

  # Worker de análisis de la Fábrica (apps/factory, D-047 — incremento C):
  # consume la cola `analysis_jobs` que llenan `submit_prototype` y
  # `request_change` desde Cowork, y corre el Agent SDK. Es el ÚNICO servicio
  # con checkout del monorepo y ANTHROPIC_API_KEY. No expone puertos ni tiene
  # healthcheck HTTP: no escucha nada (se vigila por logs y por el estado de
  # los trabajos en /factory).
  factory-runner:
    image: ghcr.io/awakelab-dev/awkplatform-factory-runner:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      FACTORY_DATABASE_URL: ${FACTORY_DATABASE_URL}
      # Credenciales del Agent SDK. Sin ellas el worker NO arranca (sale con
      # código 1 y lo grita en los logs) en vez de ir marcando en error los
      # trabajos de la cola de uno en uno.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      # Checkout dedicado, montado desde el host (ver runbook lightsail-deploy).
      PLATFORM_REPO_PATH: /platform-repo
      PLATFORM_REPO_REF: ${PLATFORM_REPO_REF:-origin/main}
      # Checkout efímero: fetch + reset --hard + clean de docs/pipeline antes de
      # cada análisis (así el agente lee el código vivo al día). La spec
      # canónica vive en la BD; lo que escribe en disco es subproducto. Se
      # activa SOLO aquí: en el checkout de un humano un reset --hard le
      # borraría el trabajo, por eso el código lo trae apagado por defecto.
      FACTORY_WORKER_GIT_SYNC: ${FACTORY_WORKER_GIT_SYNC:-1}
      FACTORY_WORKER_POLL_MS: ${FACTORY_WORKER_POLL_MS:-10000}
    volumes:
      - ${PLATFORM_REPO_HOST_PATH}:/platform-repo
      # Clave de SOLO LECTURA del repo (deploy key sin write) + known_hosts, para
      # que el `git fetch` previo a cada análisis lo haga el propio worker. Se
      # sincroniza él y no un cron del host por dos razones: (1) el contenedor
      # corre como root y es el dueño de lo que el agente escribe en el
      # checkout — un cron como `ubuntu` no podría limpiarlo; (2) un cron puede
      # caer A MITAD de un análisis y borrarle al agente los archivos que está
      # escribiendo. El worker sincroniza justo ANTES de cada run, nunca durante.
      # Si no hay clave, deja la ruta por defecto: el directorio se crea vacío,
      # el fetch falla con un warning y se analiza con lo que haya en disco.
      - ${FACTORY_RUNNER_SSH_PATH:-/opt/awkfactory/ssh-readonly}:/root/.ssh:ro
    healthcheck:
      # El proceso está vivo si Node sigue corriendo; basta con comprobar que
      # el ejecutable responde (no hay puerto que sondear).
      test: ['CMD-SHELL', 'node -e "process.exit(0)"']
      interval: 60s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/awakelab-dev/awkplatform-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT_HOST}:80'
    healthcheck:
      # 127.0.0.1 explícito, no "localhost": musl (Alpine) resuelve
      # "localhost" a ::1 primero y nginx aquí solo escucha IPv4 (el
      # entrypoint no añade "listen [::]:80" porque nuestro default.conf
      # difiere del template empaquetado) -> "connection refused" con
      # "localhost" aunque nginx esté sano.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
