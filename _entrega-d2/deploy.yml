name: Deploy

# Staging se despliega solo cuando el workflow de CI (ci.yml) terminó en verde
# sobre `main` (garantiza que las imágenes ya están publicadas en GHCR).
# Producción NUNCA se dispara sola: se promueve a mano fijando el sha exacto
# que ya se validó en staging (D-003 "promoción = re-tag de la misma imagen").
on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Sha (o "latest") a promover a producción'
        required: true
        type: string

concurrency:
  group: deploy-${{ github.event.inputs.image_tag && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy staging
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Necesario para que GITHUB_TOKEN pueda leer los paquetes de GHCR.
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH deploy (login + pull + up)
        uses: appleboy/ssh-action@v1
        env:
          # El deploy hacía `pull` confiando en un `docker login` MANUAL hecho una
          # vez en el server: cuando esa credencial caducó, el pull empezó a fallar
          # con "error from registry: denied" y el deploy se rompió en silencio
          # (2026-08-11). Ahora el propio workflow inyecta un token efímero.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_SSH_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /opt/awkfactory/staging
            docker compose --env-file .env -p awk-staging pull
            # Migraciones ENTRE el pull y el up -d (incremento D, bloque 3b).
            # Las dos bases: la de plataforma y la de la Fábrica (D-029).
            # Van con las imágenes ya bajadas y el login de GHCR vivo, porque
            # cada script hace su propio `docker pull` del migrator.
            #
            # El `set -euo pipefail` de arriba es lo que hace esto útil: si una
            # migración falla, el DEPLOY SE ROMPE EN ROJO y el `up -d` no llega
            # a correr. Antes, migrar era un paso manual por SSH que se podía
            # olvidar, y el síntoma era código nuevo contra un esquema viejo
            # devolviendo 500 en silencio — tropiezo documentado dos veces en
            # docs/STATUS.md.
            #
            # "latest" es correcto aquí: el trigger de este workflow es la CI de
            # `main` en verde, que acaba de publicar ese tag (y es el mismo que
            # el compose de staging levanta). Producción NO se toca: sigue con
            # promoción manual y sha fijo, y su `migrate.sh` se corre a mano.
            ~/migrate.sh staging latest
            ~/migrate-factory.sh staging latest
            docker compose --env-file .env -p awk-staging up -d
            docker image prune -f
            docker logout ghcr.io

  production:
    name: Promote to production
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH deploy (login + re-tag + pull + up)
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_SSH_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /opt/awkfactory/production
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ inputs.image_tag }}/" .env
            docker compose --env-file .env -p awk-production pull
            docker compose --env-file .env -p awk-production up -d
            docker image prune -f
            docker logout ghcr.io
